# Builds the AirPlay background receiver (airplay-bg/) in the cloud, so no local devkitPro is needed.
# Run it from the repository's Actions tab ("Run workflow"), then download the "airplay-bg" artifact.
name: airplay-bg

on:
  workflow_dispatch:
  push:
    paths: ['airplay-bg/**', 'source/airport_key.inc', '.github/workflows/airplay-bg.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mbed TLS for the Switch
        run: |
          if [ -f "$DEVKITPRO/portlibs/switch/lib/libmbedcrypto.a" ]; then
            echo "Mbed TLS is already in the image"
            exit 0
          fi
          # pkg.devkitpro.org sometimes answers 403 for a while: try again, waiting longer each time
          for i in 1 2 3 4 5 6; do
            if dkp-pacman -Sy --noconfirm switch-mbedtls; then exit 0; fi
            echo "attempt $i failed, waiting"
            sleep $((i * 20))
          done
          exit 1
      - name: Build
        run: make -C airplay-bg
      - name: Lay out the SD card files
        run: |
          D=out/atmosphere/contents/4200000047464E59
          mkdir -p "$D"
          cp airplay-bg/airplay-bg.nsp "$D/exefs.nsp"
          cp airplay-bg/toolbox.json "$D/toolbox.json"
          # no flags/boot2.flag on purpose: this test build does not start at boot
      - uses: actions/upload-artifact@v4
        with:
          name: airplay-bg
          path: out
